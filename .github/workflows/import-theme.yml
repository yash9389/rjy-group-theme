name: Import theme from live site

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-theme.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download theme zip
        run: |
          curl -fsSL -o /tmp/theme.zip "https://rjy.redcubedigital.in/wp-content/uploads/rjy-theme-export-At9rIChkGXANBMxZQUVz.zip"
          echo "81ff4b8f5029e51f5ef2de6d92ed6ddc  /tmp/theme.zip" | md5sum -c -

      - name: Unzip and commit
        run: |
          unzip -o -q /tmp/theme.zip -d .
          git rm -q .github/workflows/import-theme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Import RJY Group theme from rjy.redcubedigital.in"
          git push origin HEAD:main
